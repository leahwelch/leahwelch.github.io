<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" type="text/css" href="./style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>
    <div id="container">
        <div id="chart" style="background-image: url('./assets/image.png');"></div>
        <div id="controls">
            <!-- <div class="button_group">
                <p>Campus</p>
                <button class="campus_tabs active" onclick="campus(event)" id="campus_all" value="all">All</button>
                <button class="campus_tabs" onclick="campus(event)" id="north" value="north">North</button>
                <button class="campus_tabs" onclick="campus(event)" id="south" value="south">South</button>
                <button class="campus_tabs" onclick="campus(event)" id="east" value="east">East</button>

            </div> -->
            <div class="button_group">
                <p>Relationship Status</p>
                <button class="status_tabs active" onclick="status(event)" id="status_all" value="all">All</button>
                <button class="status_tabs" onclick="status(event)" id="married" value="Married">Married</button>
                <button class="status_tabs" onclick="status(event)" id="remarried" value="Remarried">Remarried</button>
                <button class="status_tabs" onclick="status(event)" id="dating" value="Dating">Dating</button>
                <button class="status_tabs" onclick="status(event)" id="engaged" value="Engaged">Engaged</button>
                <button class="status_tabs" onclick="status(event)" id="living_together" value="Living together (not married)">Living togther (not married)</button>
            </div>
            <div class="button_group">
                <p>Relationship Length</p>
                <button class="length_tabs active" onclick="length(event)" id="length_all" value="all">All</button>
                <button class="length_tabs" onclick="length(event)" id="under_two" value="0-2 years">0-2 years</button>
                <button class="length_tabs" onclick="length(event)" id="three_to_five" value="3-5 years">3-5 years</button>
                <button class="length_tabs" onclick="length(event)" id="six_to_ten" value="6-10 years">6-10 years</button>
                <button class="length_tabs" onclick="length(event)" id="eleven_to_twenty" value="11-20 years">11-20 years</button>
                <button class="length_tabs" onclick="length(event)" id="twentyone_to_thirty" value="21-30 years">21-30 years</button>
                <button class="length_tabs" onclick="length(event)" id="thirtyone_to_forty" value="31-40 years">31-40 years</button>
                <button class="length_tabs" onclick="length(event)" id="over_fortyone" value="41+ years">41+ years</button>
            </div>
            <div class="button_group">
                <p>Kids</p>
                <button class="kids_tabs active" onclick="kids(event)" id="kids_all" value="all">All</button>
                <button class="kids_tabs" onclick="kids(event)" id="kids_none" value="I don't have kids">None</button>
                <button class="kids_tabs" onclick="kids(event)" id="kids_under_five" value="I have kids 0-5">Kids 0-5</button>
                <button class="kids_tabs" onclick="kids(event)" id="kids_to_fifth" value="I have kids K-5th grade">Kids k-5th grade</button>
                <button class="kids_tabs" onclick="kids(event)" id="kids_to_twelfth" value="I have kids 6th-12th grade">Kids 6th-12th grade</button>
                <button class="kids_tabs" onclick="kids(event)" id="adult_children" value="I have adult children">Adult Children</button>
            </div>
            <div class="button_group">
                <p>Respondent Age</p>
                <button class="age_tabs active" onclick="age(event)" id="age_all" value="all">All</button>
                <button class="age_tabs" onclick="age(event)" id="under_eighteen" value="<18">Under 18</button>
                <button class="age_tabs" onclick="age(event)" id="to_twentyfour" value="18-24">18-24</button>
                <button class="age_tabs" onclick="age(event)" id="to_thirty" value="25-30">25-30</button>
                <button class="age_tabs" onclick="age(event)" id="to_forty" value="31-40">31-40</button>
                <button class="age_tabs" onclick="age(event)" id="to_fifty" value="41-50">41-50</button>
                <button class="age_tabs" onclick="age(event)" id="to_sixty" value="51-60">51-60</button>
                <button class="age_tabs" onclick="age(event)" id="to_seventy" value="61-70">61-70</button>
            </div>
            <div class="button_group">
                <p>Respondent Gender</p>
                <button class="gender_tabs active" onclick="gender(event)" id="gender_all" value="all">All</button>
                <button class="gender_tabs" onclick="gender(event)" id="male" value="Male">Male</button>
                <button class="gender_tabs" onclick="gender(event)" id="female" value="Female">Female</button>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
