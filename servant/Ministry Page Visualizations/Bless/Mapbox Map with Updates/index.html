<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Impact Map Test</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.3/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.3/mapbox-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@5/turf.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }

    #control_panel {
      /* position: absolute; */
      position: absolute;
      top: 30%;
      left: 75%;
      z-index: 9;
      background-color: rgba(255, 255, 255, 0.85);
      border: 1px solid #b9b8b9;
      text-align: left;
      color: white;
      font-size: 9pt;
      padding: 20px;
      border-radius: 5px;
    }

    button {

      margin-top: 5px;
      background-color: #ffffff;
      border: 1px solid #00A469;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 9pt;
      color: #00A469;
      text-align: center;
      width: 75px;
      height: 25px;
      display: block;
    }

    button:hover {
      background-color: #00A469;
      color: #fff9f2;
    }

    button:focus {
      background-color: #00A469;
      color: #fff9f2;
      outline: 0;
    }

    button.active {
      background-color: #00A469;
      color: #fff9f2;
      outline: 0;
    }

    .tooltip {
      position: absolute;
      left: 0px;
      top: 0px;
      visibility: hidden;
      color: white;
      background-color: rgba(0, 0, 0, 100);
      z-index: 7;
      padding: 8px;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <div id="control_panel">
    <button class="tablinks active" id="prayer_button" onclick="showVis(event)">Prayers</button>
    <button class="tablinks" id="light_button" onclick="showVis(event)">Lights</button>
    <button class="tablinks" id="listen_button" onclick="showVis(event)">Listens</button>
    <button class="tablinks" id="eat_button" onclick="showVis(event)">Eats</button>
    <button class="tablinks" id="serve_button" onclick="showVis(event)">Serves</button>
    <button class="tablinks" id="story_button" onclick="showVis(event)">Stories</button>
  </div>
  <script src="script.js" type="text/javascript"></script>

</body>

</html>
